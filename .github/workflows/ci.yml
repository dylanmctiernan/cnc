name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      # Erlang/Elixir versions come from .mise.toml, same as local dev.
      - uses: jdx/mise-action@v2

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('.mise.toml', 'mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get
      - run: mix format --check-formatted
      # Boundary violations are compiler warnings, so this fails the build on them.
      - run: mix compile --warnings-as-errors
      - run: mix test
