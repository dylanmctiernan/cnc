# grblHAL settings baked into the simulator image (see configure.sh).
# Matches the planned machine: 1250 x 1250 mm, 50 mm/s max jog, 500 mm/s^2.
#
# Homing and soft limits stay OFF: the simulator doesn't model limit switches
# (homing never completes) and grblHAL rejects soft limits ($20) without
# homing (error:10). Against this sim, the host's travel clamp is the only
# travel limit.
$22=0
$20=0
$110=3000
$111=3000
$112=600
$120=500
$121=500
$122=100
$130=1250
$131=1250
$132=100
