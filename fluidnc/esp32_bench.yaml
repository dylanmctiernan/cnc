# FluidNC configuration: bench ESP32 (ELEGOO 30-pin ESP-WROOM-32), no motors.
# Upload to the board as config.yaml. The 6x board will get its own file
# with the same axes and its own pins.
#
# Keep the axes in step with native.yaml (dev): same travel, speeds and
# homing; only pins and stepping differ.
#
# Ranges our app expects (CNC machine travel): X/Y 0..1250, Z -100..0.
# FluidNC derives them from homing: homing toward the negative end with
# mpos_mm 0 gives 0..max_travel_mm; homing toward the positive end gives
# -max_travel_mm..0. So X/Y home negative (front-left), Z homes up.
#
# Pins (ESP32 DevKit, 30-pin). Avoided: 6-11 (flash), 0/2/5/12/15 (boot
# strapping), 1/3 (USB serial), 34-39 (input only, no pull-ups).
#   step/dir outputs: X 25/26, Y 27/14, Z 33/32, shared disable 13
#   switch inputs (button to GND, internal pull-up): X 16, Y 17, Z 4, probe 18
#
# steps_per_mm is a placeholder until the drive train is chosen
# (DM542T microstepping × motor steps / mm per rev).

name: "DHM CNC router"
board: "ESP32 DevKit (bench)"

stepping:
  engine: RMT
  idle_ms: 255
  pulse_us: 4
  dir_delay_us: 1
  disable_delay_us: 0

axes:
  shared_stepper_disable_pin: gpio.13

  x:
    steps_per_mm: 80
    max_rate_mm_per_min: 3000
    acceleration_mm_per_sec2: 500
    max_travel_mm: 1250
    soft_limits: true
    homing:
      cycle: 2
      positive_direction: false
      mpos_mm: 0
      feed_mm_per_min: 100
      seek_mm_per_min: 2000
      settle_ms: 250
    motor0:
      limit_neg_pin: gpio.16:low:pu
      hard_limits: true
      pulloff_mm: 2
      standard_stepper:
        step_pin: gpio.25
        direction_pin: gpio.26

  y:
    steps_per_mm: 80
    max_rate_mm_per_min: 3000
    acceleration_mm_per_sec2: 500
    max_travel_mm: 1250
    soft_limits: true
    homing:
      cycle: 2
      positive_direction: false
      mpos_mm: 0
      feed_mm_per_min: 100
      seek_mm_per_min: 2000
      settle_ms: 250
    motor0:
      limit_neg_pin: gpio.17:low:pu
      hard_limits: true
      pulloff_mm: 2
      standard_stepper:
        step_pin: gpio.27
        direction_pin: gpio.14

  z:
    steps_per_mm: 400
    max_rate_mm_per_min: 1200
    acceleration_mm_per_sec2: 200
    max_travel_mm: 100
    soft_limits: true
    homing:
      cycle: 1
      positive_direction: true
      mpos_mm: 0
      feed_mm_per_min: 100
      seek_mm_per_min: 600
      settle_ms: 250
    motor0:
      limit_pos_pin: gpio.4:low:pu
      hard_limits: true
      pulloff_mm: 2
      standard_stepper:
        step_pin: gpio.33
        direction_pin: gpio.32

probe:
  pin: gpio.18:low:pu

start:
  must_home: false
